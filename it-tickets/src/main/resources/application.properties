spring.application.name=it-tickets

spring.datasource.url=jdbc:postgresql://localhost:15432/ItTickets
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update

# Mostra le query SQL generate da JPA
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# Indica a Hibernate il dialect di Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Evita problemi con la creazione di LOB in alcune versioni di Hibernate+Postgres
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

logging.level.root=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.web.socket.messaging=DEBUG
logging.level.org.springframework.messaging.simp=DEBUG


# ----------------------------------------
# URLs
# ----------------------------------------
app.frontend.url=http://localhost:4201
server.port = 9090

